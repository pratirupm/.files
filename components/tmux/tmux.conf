# Managed by pratirupm/.files.
# Vague colors first, then the behavior that should win.
source-file "${HOME}/.config/tmux/vague.conf"

set -g status-position top

# Prefix.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Splits and panes, in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows and reload.
bind c new-window -c "#{pane_current_path}"
bind Tab last-window
bind r source-file "${HOME}/.tmux.conf" \; display-message "dotfiles: tmux reloaded"

# Terminal behavior.
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on
set -g allow-passthrough on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# zsh is installed by the zsh component; tmux starts it even when bash is the
# login shell.
set -g default-shell "${HOME}/.local/bin/zsh"
set -g default-command "${HOME}/.local/bin/zsh -l"

# Plugins (tpm).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @resurrect-dir "${HOME}/.tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run "${HOME}/.tmux/plugins/tpm/tpm"
