NAME="tmux"
DESCRIPTION="tmux with vague colors, sensible keymaps, and TPM plugins"
REQUIRES=("core" "zsh")
AFTER=("zsh")
SYSTEM_DEPS=()
LINKS=(
  "$DOTFILES/components/tmux/vague.conf|$HOME/.config/tmux/vague.conf"
)
TEMPLATES=(
  "$DOTFILES/components/tmux/tmux.conf|$HOME/.tmux.conf|644"
)
DATA_DIRS=(
  "$HOME/.tmux/plugins"
)
