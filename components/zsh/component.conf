NAME="zsh"
DESCRIPTION="zsh from micromamba, oh-my-zsh, plugins, fzf, and starship"
REQUIRES=("core")
AFTER=("core")
SYSTEM_DEPS=()
LINKS=(
  "$DOTFILES/components/zsh/zshenv|$HOME/.zshenv"
  "$DOTFILES/components/zsh/zshrc|$HOME/.config/zsh/.zshrc"
  "$DOTFILES/components/zsh/dotfiles.zsh|$HOME/.config/zsh/dotfiles.zsh"
)
TEMPLATES=()
DATA_DIRS=(
  "$HOME/.local/share/dotfiles/zsh"
  "$HOME/.local/share/oh-my-zsh"
)
