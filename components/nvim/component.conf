NAME="nvim"
DESCRIPTION="NvChad configuration with the vague base46 theme"
REQUIRES=("core")
AFTER=("core")
SYSTEM_DEPS=(
  "gcc|compile treesitter parsers"
  "make|build treesitter parsers"
  "unzip|extract Mason zip packages"
)
LINKS=(
  "$DOTFILES/components/nvim|$HOME/.config/nvim"
)
TEMPLATES=()
DATA_DIRS=(
  "$HOME/.local/share/nvim/lazy"
  "$HOME/.local/share/nvim/mason"
  "$HOME/.local/share/nvim/base46"
  "$HOME/.cache/nvim"
)
